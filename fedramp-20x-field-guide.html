function renderStart(){
  const m=DATA.meta;
  const vdrEff=DATA.rulesets.find(r=>r.id==="VDR").effective;
  const scope=[
   ["Assurance basis","Documented plans, reviewed once a year","Measured outcomes, verified & validated continuously"],
   ["Security requirements","Rev5 Controls (NIST 800-53 baseline)","Key Security Indicators (KSI) — 10 families, "+DATA.ksi.reduce((a,f)=>a+f.indicators.length,0)+" indicators"],
   ["Core security document","System Security Plan (SSP)","Security Decision Record (SDR) + Certification Package Overview"],
   ["Independent reviewer","Third-Party Assessment Organization (3PAO)","Assessor (FedRAMP-Recognized), advisor kept separate"],
   ["Legal status word","“Authorized” (ATO)","“Certified” (satisfies the authorization requirement)"],
   ["Path to certification","Agency-sponsored ATO or JAB","Program path direct from FedRAMP (Agency path is Rev5-legacy)"],
   ["Assurance tiers","One bar per impact level","Certification Classes A → D (rising assurance)"],
   ["Vulnerability severity","CVSS / raw scanner severity","Potential Agency Impact (PAIN) N1–N5, judged in context"],
   ["Format","Human documents (PDF/Word)","Machine-readable JSON against published schemas, everywhere"],
   ["Monitoring","Monthly POA&M + annual assessment","Persistent detection + collaborative continuous monitoring"],
  ];
  return execBox(`This guide turns the FedRAMP 20x rules into something a vulnerability team can actually operate. <b>20x is the 2026 rebuild of FedRAMP</b>: it swaps binders of documented plans for continuously measured, machine-readable outcomes, and it puts vulnerability detection, evaluation, and remediation at the center of staying certified. Start here for the mental model and the exact scope of what changed from the legacy program (Rev5); every other tab drills into one part. Read the tabs top-to-bottom to onboard, or jump straight to <b>Remediation Clocks</b> and <b>Incidents</b> when you need a number.`)
  + sec("The whole model in one picture")
  + `<div class="map">
      <div class="layer"><div class="lh">What you earn</div><h4>A FedRAMP Certification Profile</h4><p>Type (Rev5 or 20x) × Path (Program or Agency) × Class (A–D). This fixes which rules and clocks apply to you.</p></div>
      <div class="layer"><div class="lh">The rulebook</div><h4>17 rulesets of MUST / SHOULD / MAY statements</h4><p>Each ruleset owns one area — scope, communication, change, vulnerabilities, incidents, data sharing. Every requirement is a single addressable rule ID.</p></div>
      <div class="layer"><div class="lh">What “secure” means</div><h4>Key Security Indicators + the vulnerability loop</h4><p>KSIs define the security outcomes you prove; VDR/VER run the continuous detect → evaluate → remediate → report loop over everything else.</p></div>
      <div class="layer"><div class="lh">What agencies see</div><h4>Machine-readable Certification Data in a trust center</h4><p>Reports, notifications, and evidence — valid JSON against published schemas — shared continuously so agencies can automate their own monitoring.</p></div>
     </div>`
  + sec("The five force words — read every rule through these")
  + `<div class="grid g4">
      <div class="card"><h4>${forceBadge("MUST")}</h4><div class="crux">A hard requirement. Absence is a finding.</div></div>
      <div class="card"><h4>${forceBadge("SHOULD")}</h4><div class="crux">Strongly expected. Not doing it needs a documented, accepted reason and its risk.</div></div>
      <div class="card"><h4>${forceBadge("MAY")}</h4><div class="crux">Genuinely optional — an allowance, not an expectation.</div></div>
      <div class="card"><h4>${forceBadge("MUST NOT")} ${forceBadge("SHOULD NOT")}</h4><div class="crux">A prohibition — the mirror image of MUST / SHOULD.</div></div>
     </div>`
  + `<div class="note" data-min-depth="2"><b>Why this matters for vulnerabilities:</b> almost the entire VDR/VER timeframe machinery is written as <b>SHOULD</b>, not MUST. That is not a loophole — a provider who routinely misses SHOULD clocks without accepted justification is building a pattern that damages the certification. Treat the clocks as operational law.</div>`
  + sec("Scope of change — Rev5 → 20x")
  + `<div class="tblwrap"><table class="scope"><thead><tr><th style="width:20%">Dimension</th><th style="width:36%">Legacy (Rev5)</th><th style="width:6%"></th><th>20x</th></tr></thead><tbody>`
    + scope.map(r=>`<tr><td class="h">${esc(r[0])}</td><td class="was">${esc(r[1])}</td><td class="arw">→</td><td class="now">${md(r[2])}</td></tr>`).join("")
    + `</tbody></table></div>`
  + sec("Dates that anchor the rollout")
  + `<div class="two"><div class="card">
      <div class="kv"><span class="k">Consolidated Rules launched</span><span class="v">2026-06-24</span></div>
      <div class="kv"><span class="k">This ruleset version</span><span class="v">${esc(m.version)} · updated ${esc(m.updated)}</span></div>
     </div><div class="card">
      <div class="kv"><span class="k">VDR / VER optional adoption</span><span class="v">${esc(vdrEff.optional_adoption||"2026-07-04")}</span></div>
      <div class="kv"><span class="k">VDR / VER required (BOD 26-04)</span><span class="v">${esc(vdrEff.obtain||"2026-12-07")}</span></div>
     </div></div>`
  + `<div class="depth-hint" data-min-depth="3">You're at full depth — every tab now shows source rule statements and edge cases. Drop to Working or Essentials to compress.</div>`;
}

function renderCert(){
  return execBox(`Use this tab to place any offering on the FedRAMP map and know instantly which requirements bind it. A <b>Certification Profile</b> is three independent choices — Type, Path, and Class — and the Class in particular sets the tempo of every vulnerability and incident clock in this guide. It also covers how you actually get certified, how Class A leans on an outside framework, and how you move between classes. When someone says “we're going for Class C,” this is the tab that says what that costs.`)
  + sec("Build a profile")
  + `<div class="calc" id="profcalc">
      <div class="f"><label>Type</label><select id="p-type"><option value="20x">20x — measured outcomes</option><option value="rev5">Rev5 — documented plans (legacy)</option></select></div>
      <div class="f"><label>Path</label><select id="p-path"><option value="program">Program — direct from FedRAMP</option><option value="agency">Agency — sponsored (Rev5 only)</option></select></div>
      <div class="f"><label>Class</label><select id="p-class"><option value="A">A — minimal assurance</option><option value="B">B</option><option value="C" selected>C</option><option value="D">D — significant assurance</option></select></div>
      <div class="f"></div>
      <div class="out"><div class="oi" id="profout"></div></div>
     </div>`
  + sec("The class ladder")
  + `<div class="grid g4">
     <div class="card hover"><h4>Class A</h4><div class="crux"><b>Minimal assurance.</b> Built on a recent pass from an approved outside framework. Most vulnerability timeframe rules are optional/recommended here.</div></div>
     <div class="card hover"><h4>Class B</h4><div class="crux"><b>Moderate.</b> Full FedRAMP assessment. Vulnerability & incident clocks become required and tighten.</div></div>
     <div class="card hover"><h4>Class C</h4><div class="crux"><b>High.</b> The common “serious” tier — faster detection cadence, tighter remediation and incident clocks.</div></div>
     <div class="card hover"><h4>Class D</h4><div class="crux"><b>Significant.</b> The strictest tier — daily sampling, top-severity incident reports due in minutes.</div></div>
     </div>`
  + `<div class="note">Certification Classes measure <b>assurance to government customers</b>, rising A → D. They are separate from FIPS-199 impact levels (Low/Moderate/High), which still exist as the offering's Security Category.</div>`
  + sec("Two distinctions worth burning in")
  + `<div class="two">
      <div class="card"><h4>Certified vs Authorized</h4><p>“FedRAMP Certified” is the current program status; it satisfies the legal requirement to be “FedRAMP authorized.” Same legal effect, new word.</p></div>
      <div class="card"><h4>Program vs Agency path</h4><p>20x uses the <b>Program</b> path — certification direct from FedRAMP. The <b>Agency</b>-sponsored path is a legacy route available only for Rev5.</p></div>
     </div>`
  + sec("Class A — the alternative-framework on-ramp", )
  + `<div class="card"><p>A Class A applicant must have completed, within the past 12 months, a certification or equivalent from an approved framework — <b>FedRAMP Rev5 (incl. Ready), SOC 2 Type II, or GovRAMP</b> — and supply those external assessment materials, plus a mandatory core set of FedRAMP rules on top.</p></div>`
  + sec("Getting certified & changing class")
  + ruleList(DATA.frc, CX_FRC);
}

function renderRulebook(){
  const tags=[...new Set(DATA.rulesets.map(r=>r.tag))];
  const tagLabel={assurance:"Assurance",boundary:"Boundary & data",materials:"Materials",gov:"Government",other:"Structural"};
  return execBox(`This tab explains the shape of the rules so the rest of the guide reads fast. Everything in FedRAMP 20x lives in one machine-readable file with four sections — a <b>dictionary</b> of defined terms, <b>rulesets</b> of MUST/SHOULD/MAY statements, <b>Key Security Indicators</b>, and legacy Rev5 control tailoring. There are <b>${DATA.rulesets.length} rulesets</b>; each owns one area and never repeats another's rules. Use the grid to see the whole surface area at a glance and filter to the rulesets a vulnerability owner touches most.`)
  + sec("Four sections, one file")
  + `<div class="grid g4">
     <div class="card"><h4>FRD <span class="tag">${DATA.glossary.length} terms</span></h4><p>The dictionary. Every capitalized term in a rule is defined here — precisely, often citing US Code.</p></div>
     <div class="card"><h4>FRR <span class="tag">${DATA.rulesets.length} rulesets</span></h4><p>The rules themselves, as addressable IDs like <code>VDR-CSO-DET</code> carrying a force word.</p></div>
     <div class="card"><h4>KSI <span class="tag">${DATA.ksi.reduce((a,f)=>a+f.indicators.length,0)} indicators</span></h4><p>The security outcomes you prove — 20x's replacement for a control baseline.</p></div>
     <div class="card"><h4>CTL <span class="tag">Rev5 mapping</span></h4><p>NIST 800-53 control tailoring, retained so 20x KSIs map back to Rev5 controls.</p></div>
     </div>`
  + `<div class="note" data-min-depth="2">A rule ID reads <code>RULESET-SUBSET-RULE</code>. <code>VDR-TFR-PVR</code> = Vulnerability Detection &amp; Response · Timeframes · the remediation matrix. Once you can parse an ID you can find anything.</div>`
  + sec("All "+DATA.rulesets.length+" rulesets")
  + `<div class="chipf" id="rsfilter"><button data-t="all" class="on">All</button>`+tags.map(t=>`<button data-t="${t}">${esc(tagLabel[t]||t)}</button>`).join("")+`</div>`
  + `<div class="grid g2" id="rsgrid" style="margin-top:14px"></div>`
  + sec("What a machine-readable program demands","")
  + `<div class="two">
     <div class="card"><h4>${rid("FRC-CSO-JSN")} JSON is mandatory</h4><p>Whenever a rule names a schema, the data you supply MUST be valid JSON against it. Human-readable copies exist too, kept automatically consistent.</p></div>
     <div class="card"><h4>The Certification Package</h4><p>Replaces the Rev5 base SSP with a concise overview plus the Security Decision Record — a living, verified record of security decisions across the offering's life.</p></div>
     </div>`;
}

function renderDict(){
  return execBox(`This is the precision layer. In 20x the ordinary-sounding words are load-bearing — “persistently,” “likely,” “mitigated” vs “remediated,” “internet-reachable,” “all affected parties” each have exact meanings that decide what a rule requires. Search or filter the <b>${DATA.glossary.length} defined terms</b> here whenever a rule elsewhere hinges on a word. Getting these right is the difference between passing an assessment and arguing about it.`)
  + `<div class="gtools">
      <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="gsearch" placeholder="Search terms and definitions…" autocomplete="off"></div>
      <span class="gcount" id="gcount"></span>
     </div>
     <div class="chipf" id="gtags"></div>
     <div id="glist" style="margin-top:14px"></div>`;
}

function renderKSI(){
  const total=DATA.ksi.reduce((a,f)=>a+f.indicators.length,0);
  return execBox(`Key Security Indicators are 20x's answer to “what does secure mean?” — they replace the Rev5 control checklist with <b>${total} outcome statements</b> across <b>${DATA.ksi.length} families</b>. You don't document a plan to meet a KSI; you produce evidence that the outcome is real and keep producing it. Expand a family to see its indicators and, where useful, the Rev5 controls each one maps back to. For a vulnerability owner, the KSIs are the standing security posture your detection loop is protecting.`)
  + `<div class="note">A KSI is judged on <b>evidence and effectiveness</b>, not paperwork. Each family's indicators describe a security outcome that must be demonstrably true and persistently maintained.</div>`
  + `<div id="ksilist" style="margin-top:16px"></div>`;
}

function renderLife(){
  const stages=[
   {n:"01",t:"Detect",d:"Find vulnerabilities everywhere, continuously — scans, intel, bounties, pen tests, supply chain.",r:["VDR-CSO-DET"],go:"vdr"},
   {n:"02",t:"Evaluate",d:"Judge exploitability, internet-reachability, and Potential Agency Impact (PAIN N1–N5).",r:["VER-EVA-ELX","VER-EVA-EIR","VER-EVA-EPA"],go:"ver"},
   {n:"03",t:"Remediate",d:"Mitigate or remediate on a clock set by class × PAIN × exploitability.",r:["VDR-TFR-PVR"],go:"clocks"},
   {n:"04",t:"Report",d:"Tell agencies continuously, in machine-readable form, everything since the last report.",r:["VER-RPT-PER"],go:"report"},
   {n:"05",t:"Escalate",d:"If it's internet-reachable, likely-exploitable and high-impact, run incident reporting in parallel.",r:["VER-TFR-IRI","IEC-CSO-IIR"],go:"incident"},
  ];
  return execBox(`This is the spine the whole vulnerability program hangs on. A finding moves through five stages — <b>detect → evaluate → remediate → report</b>, and for the worst findings, <b>escalate</b> to incident handling in parallel. Every VDR and VER rule in this guide slots into one of these stages. Use this tab as the map: click any stage to jump to its rules and numbers. The key idea 20x enforces is that a dangerous vulnerability is never just a quiet ticket — evaluation decides its clock, and a high-impact internet-reachable one becomes an incident.`)
  + sec("The loop")
  + `<div class="spine" id="spine">`+stages.map(s=>`<div class="stage" data-go="${s.go}"><div class="num">${s.n}</div><h4>${s.t}</h4><p>${s.d}</p><div class="rids">${s.r.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>`).join("")+`</div>`
  + sec("Mitigate vs remediate — the distinction 20x refuses to blur")
  + `<div class="grid g2">
      <div class="card"><h4>Mitigation <span class="faint">reduces risk</span></h4><p><b>Partially mitigated:</b> risk lowered but real, still detected. <b>Fully mitigated:</b> risk now negligible, but the vulnerability still exists and is still detected.</p></div>
      <div class="card"><h4>Remediation <span class="faint">eliminates</span></h4><p><b>Remediated:</b> neutralized or eliminated and no longer detected. A fully-mitigated vuln still needs remediation to truly close.</p></div>
     </div>`
  + sec("Every state a finding can be in")
  + `<div class="grid g3" id="statechips"></div>`;
}

function renderVDR(){
  return execBox(`This tab is the “what must a provider actually do” half of vulnerability work. The nine <b>VDR-CSO</b> duties define detection and response as a broad, always-on discipline — not quarterly CVE scanning — and set the traps that catch teams: failures in your own detection process count as vulnerabilities (a MUST), and you <b>should not</b> weaken security to make scanning easier or stand up new resources carrying known-exploited bugs. Below the duties are the <b>detection cadences</b> that say how often you must look, by class. Pair this with the Evaluate and Clocks tabs for the full loop.`)
  + sec("The nine detection & response duties")
  + ruleList(DATA.vdr_cso, CX_VDR)
  + sec("How often you must look — detection cadence by class")
  + legendSev()
  + `<div id="cadence"></div>`
  + `<div class=”note” data-min-depth=”2”>The detection cadences (PSD, PDD, PCD) are <b>SHOULD</b> and scale with class — what a Class A provider samples every 14 days, a Class D provider samples <b>daily</b>. The verify-and-validate cadences are firmer: <b>NMV</b> (non-machine, every 3 months) is a MUST, and <b>MVX</b> (machine resources) is a MUST at Classes B and C. “Likely to drift” resources get watched far more often than stable ones.</div>`;
}

function renderVER(){
  const painColors=["s-low","s-elev","s-mod","s-high","s-crit"];
  const painRows=DATA.ver.pain_levels.map((p,i)=>{
    const m=p.match(/\*\*(N\d)\*\*:\s*(.*)/);
    const lvl=m?m[1]:("N"+(i+1)); const txt=m?m[2]:p;
    return `<tr><td class="pain"><span class="cell ${painColors[i]}" style="padding:3px 9px;border-radius:5px">${lvl}</span></td><td>${esc(txt)}</td></tr>`;
  }).join("");
  return execBox(`Evaluation is where judgment sets the stakes. For every detected vulnerability you must decide three things — is it <b>likely exploitable</b>, is it <b>internet-reachable</b>, and what's its <b>Potential Agency Impact (PAIN N1–N5)</b> — because those three answers pick the remediation clock. This tab covers those judgments, the eight factors that inform them, and the rule that you must assume exploitation is automatable unless you can prove otherwise. Careless “not exploitable” calls are the single most dangerous shortcut in the program.`)
  + sec("The three judgments that set the clock")
  + `<div class="grid g3">
     <div class="card"><h4>Likely Exploitable?</h4><p>Reachable by a likely threat actor who could then cause harm. Minimum bar: anything an automated, unauthenticated system can exploit over the internet is automatically “likely exploitable.”</p></div>
     <div class="card"><h4>Internet-Reachable?</h4><p>Could a payload originating on the public internet reach and trigger it — even indirectly, through the app tier? Filter the payload and it stops counting.</p></div>
     <div class="card"><h4>Impact — PAIN?</h4><p>How badly would exploitation hurt the agencies using you, N1 (minimal) to N5 (debilitating, multi-agency)?</p></div>
     </div>`
  + sec("Potential Agency Impact — the N-rating scale")
  + `<div class="tblwrap"><table class="matrix"><thead><tr><th style="width:70px">Rating</th><th>Exploitation could be expected to have…</th></tr></thead><tbody>${painRows}</tbody></table></div>`
  + sec("The evaluation rules")
  + ruleList(DATA.ver.eva_rules, CX_VER)
  + sec("Eight factors to weigh in context")
  + `<div class="grid g4" id="factors"></div>`
  + sec("Evaluate quickly — the clock on evaluation itself")
  + `<div id="evu"></div>`
  + `<div class="note">Then assume the worst: <b>${rid("VER-EVA-AIA")}</b> requires you to treat exploitation as automatable unless you have evidence otherwise — so “someone would have to work hard to exploit this” is not, by itself, a defense.</div>`;
}

function renderClocks(){
  return execBox(`This is the number you'll reach for most. Once a vulnerability is evaluated, the clock to fix it is a lookup on three axes — <b>Certification Class × PAIN rating × exploitability profile</b> — and this tab makes that lookup interactive, then shows the full matrix as a heatmap. The single most useful simplification: the four classes collapse to <b>three distinct timetables</b> because Classes A and B share one. Everything here is “timeframe from evaluation,” and remember these deadlines are met by mitigation <em>or</em> remediation.`)
  + sec("Deadline calculator")
  + `<div class="calc" id="remcalc">
      <div class="f"><label>Certification Class</label><select id="c-class"><option value="a">Class A</option><option value="b">Class B</option><option value="c" selected>Class C</option><option value="d">Class D</option></select></div>
      <div class="f"><label>PAIN rating</label><select id="c-pain"><option value="5">N5 — debilitating, multi-agency</option><option value="4">N4</option><option value="3" selected>N3</option><option value="2">N2</option><option value="1">N1 — minimal</option></select></div>
      <div class="f"><label>Exploitability profile</label><select id="c-prof"><option value="irv_lev">Internet-reachable + likely exploitable</option><option value="nirv_lev">Not internet-reachable + likely exploitable</option><option value="nlev">Not likely exploitable</option></select></div>
      <div class="f"></div>
      <div class="out"><div class="big" id="rembig">—</div><div class="oi" id="remnote"></div></div>
     </div>`
  + `<div class="note" data-min-depth="2"><b>Three tiers, not four:</b> Class A and Class B share an identical table (the most lenient). Class C is stricter; Class D is strictest — its top-severity internet-reachable clock drops to <b>12 hours</b>. Learn A/B, C, and D and you know the whole matrix.</div>`
  + sec("Full remediation matrix — days from evaluation")
  + legendSev()
  + `<div id="remmatrix"></div>`
  + sec("The clocks that sit outside the matrix")
  + `<div class="grid g3">
     <div class="card"><h4>${rid("VDR-TFR-KEV")} Known Exploited Vulns</h4><p>Remediate by the due date in CISA's KEV Catalog — even if already fully mitigated — per BOD 26-04. The catalog date overrides the matrix.</p></div>
     <div class="card"><h4>${rid("VER-TFR-MAV")} 192-day acceptance</h4><p>Anything not fully mitigated or remediated within <b>192 days</b> of evaluation must be categorized an <b>accepted vulnerability</b>.</p></div>
     <div class="card"><h4>Overdue</h4><p>A vuln you intend to fix but haven't within FedRAMP's timeframe is <b>overdue</b> — a reportable state distinct from accepted.</p></div>
     </div>`;
}

function renderReport(){
  return execBox(`Reporting is how the certification stays alive between assessments — agencies decide their own risk based on what you send them. This tab covers the continuous vulnerability report (its exact required fields), the lighter field set for accepted vulnerabilities, the monthly human-readable summary, the machine-readable historical feed, and the rule that governs how much detail you may safely disclose. The throughline: report <b>everything since the last report</b>, in a defined format, continuously — and never leak detail that would help an attacker while still telling agencies enough to decide.`)
  + sec("The reporting rules")
  + ruleList(DATA.rpt.rules, CX_RPT)
  + sec("Cadence & retention")
  + `<div class="grid g3">
     <div class="card"><h4>${rid("VER-TFR-MHR")} Monthly, human-readable</h4><p>At least monthly, in a consistent human-readable format, on top of the continuous machine feed.</p></div>
     <div class="card"><h4>${rid("VER-TFR-MRH")} Historical JSON feed</h4><p id="mrhnote"></p></div>
     <div class="card"><h4>${rid("VER-TFR-MAV")} 192-day rule</h4><p>Unfixed past 192 days from evaluation → accepted vulnerability, reported with its own field set.</p></div>
     </div>`
  + sec("What a vulnerability report must carry", )
  + `<div class="two"><div class="card"><h4>Active vulnerability ${rid("VER-RPT-VDT")}</h4><div id="vdtfields" class="crux"></div></div>
     <div class="card"><h4>Accepted vulnerability ${rid("VER-RPT-AVI")}</h4><div id="avifields" class="crux"></div></div></div>`;
}

function renderIncident(){
  return execBox(`Some vulnerabilities stop being tickets and become incidents — and the reporting clock collapses from days to <b>minutes</b>. This tab defines exactly which incidents are FedRAMP-reportable (a deliberately narrow test), the fail-safe that treats any unrated incident as worst-case, and the point at which a live vulnerability must run incident reporting in parallel with its remediation. The three clock matrices — initial, ongoing, and final report — are shown in full by class and PAIN. If your case system can't page and auto-report, you can't meet Class C or D here.`)
  + sec("What makes an incident FedRAMP-reportable")
  + `<div class="two">
      <div class="card"><h4>${rid("IEC-CSO-EFR")} The test</h4><p>Does it affect — or is it likely to affect — the <b>confidentiality or integrity</b> of federal customer data? <b>Availability is deliberately absent:</b> an outage alone is not reportable unless it also touches confidentiality or integrity.</p></div>
      <div class="card"><h4>${rid("IEC-CSO-DPR")} Fail-safe rating</h4><p>Until you promptly rate it, treat a reportable incident as <b>PAIN N5</b> — the worst — which triggers the fastest clocks. No buying time by delaying the rating.</p></div>
     </div>`
  + sec("When a vulnerability crosses into incident territory")
  + `<div class="card"><p id="iriline"></p><div class="crux" style="margin-top:8px">Operationally: the same finding now runs <b>two workflows at once</b> — vulnerability remediation stays on its matrix clock, and incident reporting starts on the much faster clock below. Build the automatic rule: internet-reachable + likely-exploitable + PAIN &gt; N3 → flag for incident reporting.</p></div>`
  + sec("Incident report clocks — from identifying the reportable incident")
  + legendSev()
  + `<h3 class="sub">Initial Incident Report ${rid("IEC-CSO-IIR")}</h3><div id="iir-m"></div>`
  + `<div data-min-depth="2"><h3 class="sub">Ongoing Incident Reports ${rid("IEC-CSO-OIR")} <span class="faint" style="font-weight:400;font-size:12px">— repeat cadence while active</span></h3><div id="oir-m"></div></div>`
  + `<div data-min-depth="2"><h3 class="sub">Final Incident Report ${rid("IEC-CSO-FIR")} <span class="faint" style="font-weight:400;font-size:12px">— after recovery</span></h3><div id="fir-m"></div></div>`
  + `<div class="note">${rid("IEC-CSO-AIR")} Automate it. With initial reports due in <b>15 minutes</b> at Class D for a top-severity incident, hand-crafted email cannot keep pace — automation is effectively required.</div>`;
}

function renderChange(){
  return execBox(`Between assessments, two things keep agencies current: telling them when you change the service, and reporting on it on a rhythm. This tab covers the four kinds of significant change and their notification timelines — from “no notice needed” for routine changes to a month of advance warning for transformative ones — plus the quarterly Ongoing Certification Report and the trust-center rules that make all of it accessible and machine-readable. It's the operational contract for staying certified without surprising your customers.`)
  + sec("Four kinds of significant change")
  + `<div class="grid g4">
     <div class="card"><h4>Routine Recurring</h4><p>Regular operational change, incl. vuln mitigation/remediation. <b>No formal notification.</b></p></div>
     <div class="card"><h4>Adaptive</h4><p>Planned, low new-risk. Notify within <b>10 business days after</b> finishing.</p></div>
     <div class="card"><h4>Transformative</h4><p>Introduces substantive new risk. Advance + after notifications; assessed in depth.</p></div>
     <div class="card"><h4>Class Change</h4><p>Changes the whole offering's Certification Class — requires a new certification.</p></div>
     </div>`
  + sec("Change notification rules")
  + ruleList(DATA.scn, CX_SCN)
  + sec("Reporting rhythm & data sharing")
  + ruleList(DATA.share.ccm, CX_CCM)
  + `<div style="margin-top:8px">`+ruleList(DATA.share.cds, CX_CDS)+`</div>`;
}

function renderDataC(){
  return execBox(`20x is a machine-readable program, and these <b>${DATA.schemas.length} JSON schemas</b> are the contracts that make it one. Reports, incident notices, change notifications, and the Security Decision Record each have a published schema your data must validate against. This tab lists them with their required fields and the rule each one serves — useful when you're wiring your vulnerability and incident tooling to emit compliant output instead of hand-written documents. Machine-readable isn't a formatting preference here; it's how agencies automate trust.`)
  + `<div class="note">${rid("FRC-CSO-JSN")} When a rule names a schema, your machine-readable submission MUST validate against it. ${rid("CDS-CSO-CBF")} Where the same data also exists in human-readable form, automation keeps the two consistent.</div>`
  + `<div class="grid g2" id="schemas" style="margin-top:16px"></div>`;
}

function renderMandates(){
  return execBox(`20x doesn't float free — it's anchored in federal law, CISA directives, and existing standards, and it points outward to them. This tab collects the external basis a program owner should be able to cite: the <b>CISA BOD 26-04</b> mandate that makes VDR/VER and KEV remediation binding, the statutes and NIST/ISO standards the definitions rest on, the outside frameworks Class A accepts, and the accreditation regime behind recognized assessors. It also flags one forward-looking rule worth knowing: generative-AI output cannot stand in for deterministic evidence.`)
  + sec("The mandate that gives VDR/VER teeth")
  + `<div class="two">
     <div class="card"><h4>CISA BOD 26-04</h4><p>Binding Operational Directive “Prioritizing Security Updates Based on Risk.” It <b>mandates</b> the VDR and VER rulesets (required 2026-12-07) and requires remediating <b>Known Exploited Vulnerabilities</b> by their CISA KEV Catalog due dates.</p></div>
     <div class="card"><h4>The KEV Catalog</h4><p>CISA's authoritative list of vulnerabilities known to be exploited in the wild. A KEV's catalog due date overrides the normal remediation matrix — fix by then even if fully mitigated.</p></div>
     </div>`
  + sec("Standards & statutes the rules rest on")
  + `<div class="tblwrap"><table><thead><tr><th style="width:34%">Source</th><th>What 20x uses it for</th></tr></thead><tbody>
     <tr><td class="h">44 U.S. Code §3502</td><td>Definitions of “agency,” “information resource,” “machine-readable.”</td></tr>
     <tr><td class="h">44 U.S. Code §3552</td><td>Statutory definition of “incident.”</td></tr>
     <tr><td class="h">44 U.S. Code §3607–3608</td><td>Certification package &amp; the FedRAMP Certification Act basis.</td></tr>
     <tr><td class="h">6 U.S. Code §650(25)</td><td>Statutory definition of “security vulnerability.”</td></tr>
     <tr><td class="h">NIST FIPS 199</td><td>Security Category / impact levels (Low, Moderate, High).</td></tr>
     <tr><td class="h">NIST SP 800-37 Rev. 2</td><td>Definition of a “significant change.”</td></tr>
     <tr><td class="h">ISO/IEC 27001:2022</td><td>The verify-vs-validate conformity concepts.</td></tr>
     </tbody></table></div>`
  + sec("Approved alternative frameworks (Class A)")
  + `<div class="grid g3">
     <div class="card"><h4>FedRAMP Rev5</h4><p>Including FedRAMP Ready, at any historical baseline.</p></div>
     <div class="card"><h4>SOC 2 Type II</h4><p>Complete report, with bridge or gap letter as applicable.</p></div>
     <div class="card"><h4>GovRAMP</h4><p>At any impact level.</p></div>
     </div>`
  + sec("Recognized assessors & one forward-looking rule")
  + `<div class="two">
     <div class="card"><h4>A2LA-backed recognition</h4><p>Independent assessors earn FedRAMP Recognition through A2LA accreditation (R311), keep it with surveillance and reassessment, and <b>can't assess an offering they advised within the prior 2 years</b> — advice and judgment stay separate hands.</p></div>
     <div class="card"><h4>${rid("FRD-DTM")} No generative AI as evidence</h4><p>Deterministic telemetry must be a factual, reproducible observation from an authoritative source. Probabilistic or generative-AI output explicitly <b>must not</b> be used to produce it.</p></div>
     </div>`;
}

        <div class="gbody">${md(g.def)}${g.note?`<div class="gnote"><b>Note:</b> ${md(g.note)}</div>`:""}${g.ref?`<div class="gnote">Source: ${esc(g.ref)}</div>`:""}</div>

function painMatrix(mountId, per /* {a:{force,cells|pain}} */, mode){
  const box=$("#"+mountId); if(!box)return;
  const painOrder=["5","4","3","2","1"];
  function cell(clsData,n){
    const c = mode==="rem" ? clsData.pain[n] : clsData.cells[n];
    if(mode==="rem"){ // c is lanes object; not used in this generic path
      return "";
    }
    if(!c)return`<td class="cell s-none">—</td>`;
    const h=toHours(c);return`<td class="cell s-${sev(h)}">${fmtCell(c)}</td>`;
  }
  const rows=painOrder.map(n=>`<tr><td class="pain">${n==="1"?'N1':'N'+n}</td>${["a","b","c","d"].map(cl=>cell(per[cl],n)).join("")}</tr>`).join("");
  const forceRow=`<tr><td class="faint kmap" style="text-align:center">force</td>${["a","b","c","d"].map(cl=>`<td class="cell faint kmap">${esc(per[cl].force||"")}</td>`).join("")}</tr>`;
  box.innerHTML=`<div class="tblwrap"><table class="matrix"><thead><tr><th style="width:60px">PAIN</th><th class="cls">A</th><th class="cls">B</th><th class="cls">C</th><th class="cls">D</th></tr></thead><tbody>${rows}${forceRow}</tbody></table></div>`;
}

function mountRemMatrix(){
  const box=$("#remmatrix"); if(!box)return;
  const lanes=[["irv_lev","Internet-reachable + likely exploitable"],["nirv_lev","Not internet-reachable + likely exploitable"],["nlev","Not likely exploitable"]];
  const painOrder=["5","4","3","2"];
  let html="";
  lanes.forEach(([lane,label])=>{
    const rows=painOrder.map(n=>{
      const cells=["a","b","c","d"].map(cl=>{
        const c=DATA.remediation[cl].pain[n][lane];
        if(!c)return`<td class="cell s-none">—</td>`;
        const h=toHours(c);return`<td class="cell s-${sev(h)}">${fmtCell(c)}</td>`;
      }).join("");
      return `<tr><td class="pain">N${n}</td>${cells}</tr>`;
    }).join("");
    html+=`<h3 class="sub">${esc(label)}</h3><div class="tblwrap"><table class="matrix"><thead><tr><th style="width:70px">PAIN</th><th class="cls">A</th><th class="cls">B</th><th class="cls">C</th><th class="cls">D</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  });
  html+=`<div class="kmap faint" style="margin-top:8px">N1 has no remediation deadline at any class. Classes A and B are identical throughout — three distinct tables.</div>`;
  box.innerHTML=html;
}

/* remediation calculator */
function wireRemCalc(){
  const big=$("#rembig"); if(!big)return;
  function upd(){
    const cl=$("#c-class").value,n=$("#c-pain").value,prof=$("#c-prof").value;
    const note=$("#remnote");
    if(n==="1"){big.textContent="No deadline";big.style.color="var(--s-low)";note.innerHTML="PAIN N1 carries no remediation deadline at any class — mitigate or remediate during routine operations as you determine necessary.";return;}
    const c=DATA.remediation[cl].pain[n][prof];
    if(!c){big.textContent="—";note.textContent="";return;}
    const h=toHours(c);const sc=sev(h);
    const scol={crit:"var(--s-crit)",sev:"var(--s-sev)",high:"var(--s-high)",mod:"var(--s-mod)",elev:"var(--s-elev)",low:"var(--s-low)"}[sc];
    big.textContent=fmtCell(c);big.style.color=scol;
    const profTxt={irv_lev:"internet-reachable + likely exploitable",nirv_lev:"not internet-reachable but likely exploitable",nlev:"not likely exploitable"}[prof];
    const tier = (cl==="a"||cl==="b")?"Classes A and B share this (most lenient) table":cl==="c"?"Class C — stricter":"Class D — strictest";
    note.innerHTML=`From completed evaluation, for a <b>Class ${cl.toUpperCase()}</b>, <b>PAIN N${n}</b>, ${profTxt} vulnerability. ${tier}. Met by mitigation <em>or</em> remediation.`;
  }
  ["c-class","c-pain","c-prof"].forEach(id=>$("#"+id).addEventListener("change",upd));upd();
}

/* ================= nav / tabs / depth ================= */
function buildNav(){
  const nav=$("#nav");let html="";let lastGrp="";
  TABS.forEach((t,i)=>{if(t.grp!==lastGrp){html+=`<div class="grp">${esc(t.grp)}</div>`;lastGrp=t.grp;}
    html+=`<button data-tab="${t.id}"><span class="n">${String(i+1).padStart(2,"0")}</span><span>${esc(t.label)}</span></button>`;});
  nav.innerHTML=html;
  $("#foot").innerHTML=`Consolidated Rules<br>v${esc(DATA.meta.version)} · ${esc(DATA.meta.updated)}<br>${DATA.rulesets.length} rulesets · ${DATA.glossary.length} terms`;
  nav.addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;go(b.dataset.tab);closeSide();});
}
let rendered={};
function go(id){
  const tab=TABS.find(t=>t.id===id)||TABS[0];
  $$all(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab.id));
  $("#tt").innerHTML=`${esc(tab.label)} <small>${esc(tab.sub)}</small>`;
  const wrap=$("#wrap");
  wrap.innerHTML=`<div class="panel on" id="panel-${tab.id}"></div>`;
  $("#panel-"+tab.id).innerHTML=tab.render();
  // mounts per tab
  ({rulebook:mountRulesets,dict:mountGlossary,ksi:mountKSI,vdr:mountCadence,
    ver:()=>{mountFactors();mountEVU();},clocks:()=>{wireRemCalc();mountRemMatrix();},
    report:mountReportBits,incident:mountIncident,change:()=>{},data:mountSchemas,
    cert:wireProfile,life:mountStates}[tab.id]||(()=>{}))();
  wireExpanders();applyDepth();window.scrollTo(0,0);
  if(history.replaceState)history.replaceState(null,"","#"+tab.id);
}
function $$all(s){return Array.from(document.querySelectorAll(s));}

function wireExpanders(){
  $$all("[data-exp] .hd").forEach(h=>h.addEventListener("click",()=>h.parentElement.classList.toggle("open")));
  $$all("[data-gexp] .gh").forEach(h=>h.addEventListener("click",()=>h.parentElement.classList.toggle("open")));
  $$all("[data-famexp] .fh").forEach(h=>h.addEventListener("click",()=>h.parentElement.classList.toggle("open")));
  $$all(".stage[data-go]").forEach(s=>s.addEventListener("click",()=>go(s.dataset.go)));
}
function applyDepth(){
  const d=parseInt(document.documentElement.dataset.depth,10);
  $$all("[data-min-depth]").forEach(x=>{x.classList.toggle("hide",parseInt(x.dataset.minDepth,10)>d);});
}
function wireDepth(){
  $("#depthseg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    $("#depthseg .on").classList.remove("on");b.classList.add("on");
    document.documentElement.dataset.depth=b.dataset.d;applyDepth();});
}
function closeSide(){$("#side").classList.remove("show");$("#scrim").classList.remove("show");}
function wireMobile(){
  $("#menob").addEventListener("click",()=>{$("#side").classList.toggle("show");$("#scrim").classList.toggle("show");});
  $("#scrim").addEventListener("click",closeSide);
}

/* init */
buildNav();wireDepth();wireMobile();
go((location.hash||"").replace("#","")||"start");
</script>
</body>
</html>
