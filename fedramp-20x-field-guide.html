<!doctype html>
<html lang="en" data-depth="2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FedRAMP 20x — Field Guide</title>
<style>
:root{
  --bg:#0b0e14; --surface:#111621; --surface-2:#171d2b; --surface-3:#1f2636;
  --border:#293142; --border-soft:#1e2432; --line:#232b3a;
  --text:#e7ebf2; --muted:#98a2b3; --faint:#6a7488;
  --accent:#6ea8fe; --accent-dim:#33507f; --gold:#e0b45c;
  --s-low:#4a9d63; --s-elev:#8bb43a; --s-mod:#d0a52a; --s-high:#e08a3c; --s-sev:#e0603c; --s-crit:#e0475a;
  --must:#e0603c; --should:#e0b45c; --may:#6ea8fe; --not:#e0475a;
  --radius:9px; --radius-sm:6px;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sidebar:266px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code,.mono{font-family:var(--mono)}
::selection{background:#2b3c5c;color:#fff}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#2a3346;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#38435c}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.side{width:var(--sidebar);flex:0 0 var(--sidebar);background:#0c0f17;border-right:1px solid var(--border-soft);position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:40}
.brand{padding:20px 20px 14px}
.brand .k{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.brand h1{font-size:19px;margin:6px 0 2px;letter-spacing:-.01em;font-weight:650}
.brand .sub{font-size:12.5px;color:var(--muted)}
.nav{overflow-y:auto;padding:6px 10px 14px;flex:1}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--muted);font:inherit;font-size:13.5px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;line-height:1.25;margin:1px 0}
.nav button .n{font-family:var(--mono);font-size:11px;color:var(--faint);width:18px;flex:0 0 18px;text-align:right}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button.on{background:var(--surface-2);color:var(--text);font-weight:600}
.nav button.on .n{color:var(--accent)}
.nav .grp{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);padding:14px 10px 4px;font-weight:600}
.side .foot{padding:12px 20px 16px;border-top:1px solid var(--border-soft);font-size:11.5px;color:var(--faint);font-family:var(--mono);line-height:1.5}

.main{margin-left:var(--sidebar);flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:30;background:rgba(11,14,20,.86);backdrop-filter:blur(9px);border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:16px;padding:11px 30px}
.topbar .tt{font-weight:650;font-size:15px;letter-spacing:-.01em}
.topbar .tt small{color:var(--faint);font-weight:500;margin-left:8px;font-size:12px;font-family:var(--mono)}
.spacer{flex:1}
.depth{display:flex;align-items:center;gap:9px}
.depth .lab{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:2px}
.seg button{background:none;border:0;color:var(--muted);font:inherit;font-size:12.5px;padding:4px 11px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--surface-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.wrap{padding:30px 30px 90px;max-width:1180px}
.panel{display:none;animation:fade .22s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- Exec summary (the only prose) ---------- */
.exec{background:linear-gradient(0deg,var(--surface),var(--surface));border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);padding:16px 20px;margin:2px 0 26px;color:#cdd5e2;font-size:14.5px;line-height:1.66;max-width:900px}
.exec b{color:var(--text);font-weight:640}

/* ---------- Section headers ---------- */
h2.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:650;margin:34px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border-soft)}
h2.sec:first-of-type{margin-top:8px}
h3.sub{font-size:15px;margin:22px 0 10px;font-weight:620;letter-spacing:-.01em}
.lead{color:var(--muted);max-width:820px;font-size:14px}

/* ---------- Badges ---------- */
.rid{font-family:var(--mono);font-size:11px;color:var(--gold);background:rgba(224,180,92,.09);border:1px solid rgba(224,180,92,.22);padding:1px 6px;border-radius:5px;white-space:nowrap}
.force{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.03em;padding:2px 7px;border-radius:20px;white-space:nowrap;text-transform:uppercase;border:1px solid}
.force.must{color:#f0a58c;border-color:rgba(224,96,60,.4);background:rgba(224,96,60,.1)}
.force.should{color:#f0cf95;border-color:rgba(224,180,92,.38);background:rgba(224,180,92,.1)}
.force.may{color:#a8c8ff;border-color:rgba(110,168,254,.36);background:rgba(110,168,254,.1)}
.force.mustnot,.force.shouldnot{color:#f0a0ac;border-color:rgba(224,71,90,.42);background:rgba(224,71,90,.1)}
.tag{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);padding:2px 8px;border-radius:20px;background:var(--surface)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 10px}

/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px}
.card.hover{transition:border-color .15s,transform .15s}
.card.hover:hover{border-color:#38455e}
.card h4{margin:0 0 4px;font-size:14.5px;font-weight:620;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card p{margin:6px 0 0;color:var(--muted);font-size:13.5px;line-height:1.55}
.crux{color:#c3ccda;font-size:13.5px;margin-top:7px}
.crux b{color:var(--text)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.kmap{font-family:var(--mono);font-size:11px;color:var(--faint)}

/* ---------- Rule row ---------- */
.rule{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin:9px 0;overflow:hidden}
.rule .hd{display:flex;gap:11px;align-items:flex-start;padding:13px 16px;cursor:pointer}
.rule .hd:hover{background:var(--surface-2)}
.rule .meta{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.rule .r1{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.rule .nm{font-weight:600;font-size:14px}
.rule .cx{color:#c3ccda;font-size:13.5px}
.rule .stmt{display:none;padding:0 16px 15px 16px;color:var(--muted);font-size:13.5px;border-top:1px solid var(--border-soft);margin-top:0;padding-top:12px}
.rule.open .stmt{display:block}
.rule .chev{color:var(--faint);flex:0 0 auto;transition:transform .18s;margin-top:2px}
.rule.open .chev{transform:rotate(90deg)}
.danger{margin-top:10px;padding:10px 12px;border-radius:var(--radius-sm);background:rgba(224,71,90,.07);border:1px solid rgba(224,71,90,.22);color:#e6b3ba;font-size:13px}
.danger b{color:#f2c4ca}

/* ---------- Tables / matrix ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--line)}
thead th{background:var(--surface-2);color:var(--muted);font-weight:600;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(255,255,255,.015)}
td.h{font-weight:600;color:var(--text)}
.matrix td.cell{text-align:center;font-family:var(--mono);font-weight:600;font-size:12.5px}
.cell.s-none{color:var(--faint)}
.cell.s-low{color:#7fd39a;background:rgba(74,157,99,.11)}
.cell.s-elev{color:#c3e08a;background:rgba(139,180,58,.12)}
.cell.s-mod{color:#f0d68a;background:rgba(208,165,42,.13)}
.cell.s-high{color:#f4bc86;background:rgba(224,138,60,.15)}
.cell.s-sev{color:#f4a88a;background:rgba(224,96,60,.16)}
.cell.s-crit{color:#f49aa6;background:rgba(224,71,90,.2)}
.matrix th.cls{text-align:center}
.matrix td.pain{text-align:center;font-weight:700;font-family:var(--mono)}

/* ---------- Calculator ---------- */
.calc{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:14px;align-items:end;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.calc .f{display:flex;flex-direction:column;gap:6px}
.calc label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint)}
select{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;font:inherit;font-size:13.5px;cursor:pointer;min-width:150px}
select:focus{outline:none;border-color:var(--accent)}
.calc .out{grid-column:1/-1;margin-top:6px;border-top:1px solid var(--border-soft);padding-top:16px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.calc .big{font-size:34px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em}
.calc .oi{color:var(--muted);font-size:13.5px;max-width:560px}

/* ---------- Diagram: lifecycle spine ---------- */
.spine{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding:4px 0 8px}
.stage{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px;cursor:pointer;position:relative;transition:border-color .15s,transform .15s}
.stage:not(:last-child){margin-right:26px}
.stage:not(:last-child):after{content:"";position:absolute;right:-24px;top:50%;width:22px;height:2px;background:var(--accent-dim)}
.stage:not(:last-child):before{content:"";position:absolute;right:-24px;top:50%;transform:translateY(-50%);border-left:7px solid var(--accent-dim);border-top:5px solid transparent;border-bottom:5px solid transparent;z-index:2}
.stage:hover{border-color:var(--accent);transform:translateY(-2px)}
.stage .num{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.1em}
.stage h4{margin:6px 0 5px;font-size:15px;font-weight:640}
.stage p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.stage .rids{margin-top:9px;display:flex;flex-wrap:wrap;gap:4px}
.stage .rids span{font-family:var(--mono);font-size:10px;color:var(--faint)}

/* ---------- Program map ---------- */
.map{display:flex;flex-direction:column;gap:0}
.layer{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 18px;position:relative}
.layer:not(:last-child){margin-bottom:26px}
.layer:not(:last-child):after{content:"";position:absolute;left:50%;bottom:-22px;width:2px;height:20px;background:var(--accent-dim)}
.layer:not(:last-child):before{content:"";position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);border-top:7px solid var(--accent-dim);border-left:5px solid transparent;border-right:5px solid transparent;z-index:2}
.layer .lh{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
.layer h4{margin:5px 0 3px;font-size:15.5px}
.layer p{margin:0;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}

/* ---------- Scope-of-change ---------- */
.scope td.was{color:var(--muted)}
.scope td.now{color:var(--text);font-weight:560}
.scope .arw{color:var(--faint);text-align:center;font-family:var(--mono)}

/* ---------- Glossary ---------- */
.gtools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1;min-width:230px;position:relative}
.search input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px 11px 38px;color:var(--text);font:inherit;font-size:14px}
.search input:focus{outline:none;border-color:var(--accent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.chipf{display:flex;flex-wrap:wrap;gap:6px}
.chipf button{background:var(--surface);border:1px solid var(--border);color:var(--muted);font:inherit;font-size:12px;padding:5px 11px;border-radius:20px;cursor:pointer}
.chipf button.on{background:var(--surface-3);color:var(--text);border-color:#3d4a63}
.gterm{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin:8px 0}
.gterm .gh{display:flex;gap:11px;align-items:center;padding:12px 15px;cursor:pointer}
.gterm .gh:hover{background:var(--surface-2)}
.gterm .term{font-weight:620;font-size:14px}
.gterm .gbody{display:none;padding:0 15px 14px 15px;color:var(--muted);font-size:13.5px}
.gterm.open .gbody{display:block}
.gterm .gnote{margin-top:8px;padding-top:9px;border-top:1px solid var(--border-soft);color:var(--faint);font-size:12.5px}
.gcount{color:var(--faint);font-size:12.5px;font-family:var(--mono)}

/* ---------- KSI ---------- */
.fam{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin:9px 0}
.fam .fh{display:flex;gap:12px;align-items:center;padding:13px 16px;cursor:pointer}
.fam .fh:hover{background:var(--surface-2)}
.fam .fid{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--accent);background:rgba(110,168,254,.09);border:1px solid rgba(110,168,254,.22);border-radius:6px;padding:3px 8px}
.fam .fn{font-weight:620;font-size:14.5px;flex:1}
.fam .fc{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.fam .inds{display:none;border-top:1px solid var(--border-soft);padding:6px 16px 12px}
.fam.open .inds{display:block}
.ind{padding:11px 0;border-bottom:1px solid var(--border-soft)}
.ind:last-child{border-bottom:0}
.ind .i1{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.ind .iid{font-family:var(--mono);font-size:11px;color:var(--gold)}
.ind .inm{font-weight:580;font-size:13.5px}
.ind .itx{color:var(--muted);font-size:13px;margin-top:4px}
.ind .imap{margin-top:5px;font-family:var(--mono);font-size:10.5px;color:var(--faint)}

/* ---------- misc ---------- */
.note{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:var(--radius);padding:13px 16px;color:#d7cdb6;font-size:13.5px;margin:14px 0}
.note b{color:#f0e4c8}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.kv{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--faint);flex:0 0 168px;font-size:12.5px}
.kv .v{color:var(--text)}
.hide{display:none!important}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin:6px 0 2px}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
[data-min-depth]{}
.depth-hint{font-size:12px;color:var(--faint);margin:-8px 0 14px;font-style:italic}

/* ---------- responsive ---------- */
.menob{display:none}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.calc{grid-template-columns:1fr 1fr}}
@media(max-width:860px){
  :root{--sidebar:0px}
  .side{transform:translateX(-100%);transition:transform .25s;width:280px;flex-basis:280px}
  .side.show{transform:none}
  .main{margin-left:0}
  .menob{display:inline-flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);color:var(--text);width:38px;height:34px;border-radius:8px;cursor:pointer}
  .g2,.g3,.g4,.two{grid-template-columns:1fr}
  .calc{grid-template-columns:1fr}
  .wrap{padding:22px 18px 80px}
  .topbar{padding:10px 16px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;display:none}
  .scrim.show{display:block}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="k">Field Guide</div>
      <h1>FedRAMP 20x</h1>
      <div class="sub">The modernization, mapped — with Vulnerability Detection &amp; Response at the center.</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="topbar">
      <button class="menob" id="menob" aria-label="menu">☰</button>
      <div class="tt" id="tt">Start Here <small id="ttsub"></small></div>
      <div class="spacer"></div>
      <div class="depth">
        <span class="lab">Depth</span>
        <div class="seg" id="depthseg">
          <button data-d="1">Essentials</button>
          <button data-d="2" class="on">Working</button>
          <button data-d="3">Full</button>
        </div>
      </div>
    </div>
    <div class="wrap" id="wrap"></div>
  </main>
</div>

<script>
const DATA = {
 "meta": {
  "version": "2026.07.14.01",
  "updated": "2026-07-14",
  "title": "FedRAMP Consolidated Rules for 2026",
  "default_artifacts": {
   "FRR": [
    "Explanation of how the rule is followed, or an explanation of the reason and resulting risk to customers for not following the rule.",
    "Verification that the implementation is appropriate for the rule, or that the reason for not implementing is accepted by a senior official.",
    "Validation that the implementation is in place and working as intended, or that the reason for not implementing is accepted by a senior official.",
    "Independent verification.",
    "Independent validation."
   ],
   "KSI": [
    "Explanation of measures (and their objectives) that demonstrate the Key Security Indicator, or an explanation of the reason and resulting risk to customers for not having measures available for that Key Security Indicator.",
    "Explanation of the cycle for any measures that are implemented persistently (if applicable).",
    "Verification that the measures demonstrate the Key Security Indicator, or that the reason for not having them is accepted.",
    "Verification that the automation in place is accurate and sufficient to demonstrate appropriate measures for the Key Security Indicator, or that automation is not necessary for each measure.",
    "Validation that the measures are accurately produced and are in place and working as intended, or that the reason for not having them is valid."
   ]
  }
 },
 "glossary": [
  {
   "id": "FRD-ACV",
   "term": "Accepted Vulnerability",
   "tag": "Vulnerability",
   "def": "A vulnerability that the provider does not intend to fully mitigate or remediate, OR that has not or will not be fully mitigated or remediated within the maximum overdue period in FedRAMP Vulnerability Detection and Response rules.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-ADP",
   "term": "Adaptive Change",
   "tag": "Significant Changes",
   "def": "A type of significant change that does not routinely recur and does not introduce substantive potential security risks that need to be assessed in depth.",
   "note": "Adaptive changes typically require careful planning that focuses on engineering execution instead of customer adoption, can be verified with minor changes to existing automated validation procedures, and do not require large changes to operational procedures, deployment plans, or documentation.",
   "ref": ""
  },
  {
   "id": "FRD-ADV",
   "term": "Advisor",
   "tag": "Stakeholder",
   "def": "An entity that helps a provider understand, prepare for, or maintain FedRAMP Certification without replacing the provider's responsibility or the assessor's independence.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-AGY",
   "term": "Agency",
   "tag": "Stakeholder",
   "def": "Has the meaning given in 44 U.S. Code § 3502 (1), which is \"any executive department, military department, Government corporation, Government controlled corporation, or other establishment in the executive branch of the Government (including the Executive Office of the President), or any independent regulatory agency, but does not include—(A) the Government Accountability Office; (B) Federal Election Commission; (C) the governments of the District of Columbia and of the territories and possessions of the United States, and their various subdivisions; or (D) Government-owned contractor-operated facilities, including laboratories engaged in national defense research and production activities.\"",
   "note": "",
   "ref": "44 U.S. Code § 3502 (1)"
  },
  {
   "id": "FRD-AAP",
   "term": "All Affected Parties",
   "tag": "Stakeholder",
   "def": "All federal entities whose interests are affected directly or are likely to be affected directly in the event of a vulnerability or incident related to federal customer data. This always includes FedRAMP and directly impacted federal customer agencies.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-ANA",
   "term": "All Necessary Assessors",
   "tag": "Stakeholder",
   "def": "All entities who participate in the FedRAMP assessment of a cloud service offering in the context of a FedRAMP Certification. This always includes FedRAMP and any FedRAMP Recognized independent assessor contracted by a provider to perform a FedRAMP assessment.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-ANP",
   "term": "All Necessary Parties",
   "tag": "Stakeholder",
   "def": "All entities whose interests are affected directly by activity related to a specific cloud service offering in the context of FedRAMP Certifications. This always includes FedRAMP and any agency customer who is using the cloud service offering, but may include additional parties depending on agreements made by the cloud service provider (such as consultants or independent assessors). Potential agency customers or third-party cloud service providers should also be included in most cases but this is not a mandatory requirement under FedRAMP because the cloud service provider may choose who they wish to do business with.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-ART",
   "term": "Artifacts",
   "tag": "Certification",
   "def": "Security-related materials that supply information regarding or evidence of functions, policies, decisions, procedures, operations, or other such activities, for the purposes of obtaining and maintaining a FedRAMP Certification. All such artifacts are considered FedRAMP Certification Data and are included in the FedRAMP Certification Package.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-ASR",
   "term": "Assessor",
   "tag": "Stakeholder",
   "def": "An assessor that performs assessment, verification, or validation activities for a cloud service offering seeking to obtain or maintain FedRAMP Certification; FedRAMP is the final assessor for FedRAMP Certification, but FedRAMP Recognized independent assessment services are typically also utilized.",
   "note": "FedRAMP has transitioned from using the historical term \"Third-Party Assessment Organization (3PAO)\" to align with the explicit terminology used in the FedRAMP Authorization Act and to avoid the confusion caused when the same organizations provide both assessment and advisory services to different customers while being referred to as a 3PAO.",
   "ref": ""
  },
  {
   "id": "FRD-CCL",
   "term": "Certification Class",
   "tag": "Certification",
   "def": "The category of assurance that a cloud service offering supplies to federal government customers following FedRAMP Practices, increasing from minimal assurance at Class A to significant assurance at Class D; currently available categories are Class A, B, C, or D.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-CCC",
   "term": "Certification Class Change",
   "tag": "Significant Changes",
   "def": "A type of significant change that is likely to change the FedRAMP Certification class for the entire cloud service offering (e.g. from Class B to Class C or from Class D to Class C).",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-CRD",
   "term": "Certification Data",
   "tag": "Certification",
   "def": "The collective information required by FedRAMP for initial and ongoing FedRAMP Certification of a cloud service offering, including the FedRAMP Certification Package.",
   "note": "In FedRAMP documentation, certification data always refers to FedRAMP Certification Data unless otherwise specified.",
   "ref": ""
  },
  {
   "id": "FRD-CRP",
   "term": "Certification Package",
   "tag": "Certification",
   "def": "Has meaning from 44 USC § 3607 (b)(8) given to \"authorization package\", which is \"the essential information that can be used by an agency to determine whether to authorize the operation of an information system or the use of a designated set of common controls for all cloud computing products and services [certified] by FedRAMP.\"",
   "note": "In FedRAMP documentation, certification package always refers to a FedRAMP Certification Package unless otherwise specified.",
   "ref": "44 USC § 3607 (b)(8)"
  },
  {
   "id": "FRD-CPH",
   "term": "Certification Path",
   "tag": "Certification",
   "def": "The underlying source of the FedRAMP Certification, either from a federal agency sponsored authorization to operate or directly from FedRAMP itself. The agency path is a legacy path that is only available for FedRAMP Rev5 and still requires review and approval from FedRAMP.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-CPF",
   "term": "Certification Profile",
   "tag": "Certification",
   "def": "The combination of a FedRAMP Certification Type (Rev5 or 20x), FedRAMP Certification Path (Program or Agency), and FedRAMP Certification Class (A, B, C, or D) for a cloud service offering.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-CTY",
   "term": "Certification Type",
   "tag": "Certification",
   "def": "The form of assurance that a cloud service offering supplies to federal government customers following FedRAMP Practices, either Rev5 or 20x. Rev5 follows a legacy approach based primarily on documented plans while 20x follows a modern approach based primarily on measured outcomes.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-CSO",
   "term": "Cloud Service Offering",
   "tag": "General",
   "def": "A specific, packaged cloud computing product or service supplied by a cloud service provider for use by customers, that is the subject of a FedRAMP Certification.",
   "note": "The FedRAMP Minimum Assessment Scope defines the full scope of the cloud service offering from the perspective of a FedRAMP Certification.",
   "ref": ""
  },
  {
   "id": "FRD-DCE",
   "term": "Debilitating Customer Effect",
   "tag": "Customer Effect",
   "def": "An unwanted customer effect that interrupts use of the cloud service for most users or compromises the integrity or confidentiality of most federal customer data. If the adverse customer effect is unknown then it should be treated as if it is debilitating until proven otherwise.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-DTM",
   "term": "Deterministic Telemetry",
   "tag": "General",
   "def": "Verifiable data collected directly from an authoritative source that represents a factual and reproducible observation of the attributes of a system such as the system's state, configuration, or behavior.",
   "note": "Probabilistic inferences, generative outputs, or predictive assessments such as those produced using generative transformer models (commonly referred to as “Generative AI”) do not constitute a factual record of the system state and must not be used to generate deterministic telemetry.",
   "ref": ""
  },
  {
   "id": "FRD-DCF",
   "term": "Disruptive Customer Effect",
   "tag": "Customer Effect",
   "def": "An unwanted customer effect that interrupts use of the cloud service for many users for less than 24 hours, or that compromises the integrity or confidentiality of large amounts or many types of federal customer data.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-DFT",
   "term": "Drift",
   "tag": "General",
   "def": "Changes to information resources that cause deviations from the intended and assessed state; common forms of drift include changes to configurations, deployed software, privileges, running processes, and availability.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-FPV",
   "term": "False Positive Vulnerability",
   "tag": "Vulnerability",
   "def": "A detected vulnerability that is not actually present in an exploitable state in the information resource",
   "note": "This includes situations where vulnerable software or code exist on a machine-based information resource but are not loaded, running, or otherwise in an operating state required for exploitation. This only applies if the vulnerability is not and was not present; a remediated vulnerability or a fully mitigated vulnerability cannot also be a false positive vulnerability.",
   "ref": ""
  },
  {
   "id": "FRD-FCD",
   "term": "Federal Customer Data",
   "tag": "General",
   "def": "All electronic information, content, and materials that an agency or its authorized users upload, store, or otherwise supply to a cloud service for processing or storage. This does NOT include account information, service metadata, analytics, telemetry, or other similar metadata generated by the cloud service provider.",
   "note": "In the context of FedRAMP Certification, \"federal customer data\" ONLY ever refers to data owned by federal agency customers. Agreements and contracts with specific agencies may require providers to protect additional data or even transfer ownership of telemetry or usage data to the agency; always consult a lawyer that is familiar with company agreements and contracts when determining the scope of federal customer data.",
   "ref": ""
  },
  {
   "id": "FRD-FCR",
   "term": "FedRAMP Certification Report",
   "tag": "Certification",
   "def": "A report that is produced by FedRAMP documenting the results of a FedRAMP Certification assessment. This report is typically produced after the initial FedRAMP Certification assessment on the Program Certification Path and updated as necessary during ongoing FedRAMP Certification, but may be produced at any time by FedRAMP as part of ongoing FedRAMP Certification activities for any cloud service offering (such as corrective action). Cloud service offerings must include these reports in their FedRAMP Certification Package.",
   "note": "",
   "ref": "FedRAMP Certification Act (44 USC § 3608)"
  },
  {
   "id": "FRD-FCT",
   "term": "FedRAMP Certified",
   "tag": "Certification",
   "def": "The status of a cloud service offering that has received FedRAMP Certification and meets the legal requirement to be FedRAMP authorized.",
   "note": "FedRAMP uses \"FedRAMP Certified\" as the current program term for cloud service offerings that satisfy the statutory concept of FedRAMP authorization.",
   "ref": "FedRAMP Certification Act (44 USC § 3608)"
  },
  {
   "id": "FRD-FIN",
   "term": "FedRAMP Independent Assessment",
   "tag": "General",
   "def": "An independent verification and validation assessment, performed by a FedRAMP Recognized independent assessment service or FedRAMP following FedRAMP rules. These assessments are typically first performed to obtain an initial FedRAMP Certification then repeated on an annual basis to maintain FedRAMP Certification.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-FPR",
   "term": "FedRAMP Practices",
   "tag": "General",
   "def": "The security measures, safeguards, precautions, procedures, activities, policies, capabilities, mechanisms, etc. that are expected to be in place by FedRAMP to demonstrate that information resources are properly protected, expressed in FedRAMP 20x Key Security Indicators or FedRAMP Rev5 Controls and supplemented by FedRAMP rules.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-FRA",
   "term": "FedRAMP Recognized",
   "tag": "General",
   "def": "The status of independent assessment services that are recognized by FedRAMP to perform assessment activities on behalf of FedRAMP for cloud service offerings seeking to obtain or maintain FedRAMP Certification.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-FRI",
   "term": "FedRAMP Reportable Incident",
   "tag": "Incident",
   "def": "An incident that affects the confidentiality or integrity of federal customer data or is likely to affect the confidentiality or integrity of federal customer data.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-FSI",
   "term": "FedRAMP Security Inbox",
   "tag": "General",
   "def": "An email address that follows the FedRAMP Security Inbox rules.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-FIR",
   "term": "Final Incident Report (FIR)",
   "tag": "Incident",
   "def": "A final report after recovery from an incident that is supplied by FedRAMP Certified cloud service providers to FedRAMP and agency customers, following FedRAMP Incident Evaluation and Communication rules.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-FMV",
   "term": "Fully Mitigated Vulnerability",
   "tag": "Vulnerability",
   "def": "A vulnerability where the likelihood of exploitation or Potential Agency Impact N-rating has been reduced from the original evaluation until either are negligible, but the vulnerability is still detected.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-HAN",
   "term": "Handle",
   "tag": "General",
   "def": "Has the plain language meaning inclusive of any possible action taken with information, such as access, collect, control, create, display, disclose, disseminate, dispose, maintain, manipulate, process, receive, review, store, transmit, use... etc.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-INT",
   "term": "Incident",
   "tag": "Incident",
   "def": "Has the meaning given in 44 USC § 3552 (b)(2) which is \"an occurrence that (A) actually or imminently jeopardizes, without lawful authority, the integrity, confidentiality, or availability of information or an information system; or (B) constitutes a violation or imminent threat of violation of law, security policies, security procedures, or acceptable use policies.\"",
   "note": "",
   "ref": "44 USC § 3552 (b)(2)"
  },
  {
   "id": "FRD-IRS",
   "term": "Information Resource",
   "tag": "Information Resource",
   "def": "Has the meaning from 44 USC § 3502 (6): \"information and related resources, such as personnel, equipment, funds, and information technology.\" This includes any aspect of the cloud service offering, both technical and managerial, including everything that makes up the business of the offering from non-machine-based information resources like organizational policies, procedures, employees, etc. to machine-based information resources like hardware, software, cloud services, code, etc.",
   "note": "Information resources are either machine-based or non-machine-based; any requirement or recommendation that references information resources without specifying a type is inclusive of all information resources.",
   "ref": "44 USC § 3502 (6)"
  },
  {
   "id": "FRD-INC",
   "term": "Initial Certification",
   "tag": "Certification",
   "def": "The first FedRAMP Certification of a cloud service offering based on the applicable FedRAMP Practices.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-IFA",
   "term": "Initial FedRAMP Assessment",
   "tag": "Assessment",
   "def": "The first full assessment of a cloud service offering obtaining FedRAMP Certification, coordinated by the provider with all necessary assessors, that results in a FedRAMP Certification.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-IIR",
   "term": "Initial Incident Report (IIR)",
   "tag": "Incident",
   "def": "An initial report about an incident that is supplied by FedRAMP Certified cloud service providers to FedRAMP and agency customers, following FedRAMP FedRAMP Incident Evaluation and Communication rules.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-IRV",
   "term": "Internet-Reachable Vulnerability (IRV)",
   "tag": "Vulnerability",
   "def": "A vulnerability in a machine-based information resource that might be exploited or otherwise triggered by a payload originating from a source on the public internet.",
   "note": "This includes machine-based information resources that have no direct route to/from the internet but receive payloads or otherwise take action triggered by internet activity. Internet-reachability applies only to the specific vulnerable machine-based information resources processing the payload. The opposite of this is a Not Internet-reachable Vulnerability (NIRV).",
   "ref": ""
  },
  {
   "id": "FRD-KEV",
   "term": "Known Exploited Vulnerability (KEV)",
   "tag": "Vulnerability",
   "def": "Has the meaning given in CISA Binding Operational Directive 26-04, which is any vulnerability identified in CISA's Known Exploited Vulnerabilities catalog.",
   "note": "",
   "ref": "CISA BOD 26-04"
  },
  {
   "id": "FRD-LKY",
   "term": "Likely",
   "tag": "General",
   "def": "A reasonable degree of probability based on context.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-LEV",
   "term": "Likely Exploitable Vulnerability (LEV)",
   "tag": "Vulnerability",
   "def": "A vulnerability that is not fully mitigated AND is reachable by a likely threat actor; AND a likely threat actor with knowledge of the vulnerability would likely gain unauthorized access, cause harm, disrupt operations, or otherwise have an undesired adverse impact within the cloud service offering by exploiting the vulnerability.",
   "note": "At the absolute minimum, any vulnerability that an automated unauthenticated system can exploit over the internet is a likely exploitable vulnerability. The opposite of this is a Not Likely Exploitable Vulnerability (NLEV).",
   "ref": ""
  },
  {
   "id": "FRD-MBI",
   "term": "Machine-Based (Information Resources)",
   "tag": "Information Resource",
   "def": "Any information technology information resource—including systems, processes, software, hardware, services, cloud-native capabilities, and any other such capability, component, or resource—that relies primarily on mechanical or electronic devices (i.e. computers) for operation.",
   "note": "All other information resources that do not rely on computers are non-machine-based information resources.",
   "ref": ""
  },
  {
   "id": "FRD-MGN",
   "term": "Machine-Generated",
   "tag": "General",
   "def": "Automatically produced by a computer process, application, or other mechanism without the intervention or manipulation of a human during production.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-MRD",
   "term": "Machine-Readable",
   "tag": "General",
   "def": "Has the meaning from 44 U.S. Code § 3502 (18) which is \"the term \"machine-readable\", when used with respect to data, means data in a format that can be easily processed by a computer without human intervention while ensuring no semantic meaning is lost\"",
   "note": "",
   "ref": "44 U.S. Code § 3502 (18)"
  },
  {
   "id": "FRD-MCE",
   "term": "Minimal Customer Effect",
   "tag": "Customer Effect",
   "def": "An unwanted customer effect that is only noticeable by some users. This includes minor inconveniences such as reduced performance.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-NCE",
   "term": "Narrow Customer Effect",
   "tag": "Customer Effect",
   "def": "An unwanted customer effect that interrupts use of the cloud service for some users for less than 12 hours, or that compromises the integrity or confidentiality of an extremely limited amount and type of federal customer data.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-ONC",
   "term": "Ongoing Certification",
   "tag": "Certification",
   "def": "The continued FedRAMP Certification of a cloud service offering based on the applicable FedRAMP Practices.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-OCR",
   "term": "Ongoing Certification Report (OCR)",
   "tag": "General",
   "def": "A regular report that is supplied by FedRAMP Certified cloud service providers to agency customers, following FedRAMP Collaborative Continuous Monitoring rules.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-OIR",
   "term": "Ongoing Incident Report (OIR)",
   "tag": "Incident",
   "def": "A recurring report about an ongoing incident that is supplied by FedRAMP Certified cloud service providers to FedRAMP and agency customers, following the FedRAMP Incident Evaluation and Communication rules.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-ODV",
   "term": "Overdue Vulnerability",
   "tag": "Vulnerability",
   "def": "A vulnerability that the provider intends to fully mitigate or remediate but has not or will not do so within the time frames recommended or required by FedRAMP.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-PMV",
   "term": "Partially Mitigated Vulnerability",
   "tag": "Vulnerability",
   "def": "A vulnerability where the likelihood or Potential Agency Impact N-rating has been reduced from the original evaluation but the risk of exploitation still exists and the vulnerability is still detected.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-PFA",
   "term": "Persistent FedRAMP Assessment",
   "tag": "Assessment",
   "def": "Follow-on assessments of a cloud service offering focused on Key Security Indicators, coordinated by the provider with all necessary assessors, to maintain FedRAMP Certification or change its FedRAMP Certification class.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-PER",
   "term": "Persistently",
   "tag": "General",
   "def": "Occurring in a firm, steady way that is repeated over a long period of time in spite of obstacles or difficulties. Persistent activities may vary between actors, may occur irregularly, and may include interruptions or waiting periods between cycles. These attributes of persistent activities should be intentional, understood, and documented; the status of persistent activities will always be known.",
   "note": "The use of persistently indicates a process that may not always occur continuously (without interruption or gaps) or regularly (on a consistent, predictable basis) but will repeat frequently in cycles. It aligns generally with historical misuse of \"continuous\" in federal information security policies.",
   "ref": ""
  },
  {
   "id": "FRD-PAI",
   "term": "Potential Agency Impact",
   "tag": "General",
   "def": "The estimated cumulative effect of unauthorized access, disruption, harm, or other adverse impacts to all agencies using the cloud service that are likely to result from security incidents or the exploitation of vulnerabilities in the cloud service offering; as estimated following appropriate FedRAMP rules to calculate the Potential Agency Impact N-rating (PAIN).",
   "note": "Potential Agency Impact N-rating (PAIN) levels are defined in VER-EVA-EPA (Estimate Potential Agency Impact)",
   "ref": ""
  },
  {
   "id": "FRD-PAC",
   "term": "Privileged Account",
   "tag": "Accounts",
   "def": "An account with elevated privileges that enables administrative functions over some aspect of the cloud service offering that may affect the confidentiality, integrity, or availability of information beyond those given to normal users; levels of privilege may vary wildly.",
   "note": "Any references to privileged accounts in FedRAMP materials should be presumed to apply to privileged roles or other similar capabilities that are used to assign privileges to privileged accounts.",
   "ref": ""
  },
  {
   "id": "FRD-PRO",
   "term": "Promptly",
   "tag": "General",
   "def": "Without unnecessary delay.",
   "note": "The use of promptly in FedRAMP materials frames conveys a need for urgent action where the expected time frame will vary by circumstance but earlier action is more likely to improve security outcomes and increase the security posture of a cloud service offering.",
   "ref": ""
  },
  {
   "id": "FRD-PRV",
   "term": "Provider",
   "tag": "Stakeholder",
   "def": "The cloud service provider responsible for a cloud service offering in the context of FedRAMP Certification.",
   "note": "FedRAMP Consolidated Rules frequently refer to providers without using the full term \"cloud service provider\" or acronym \"CSP\".",
   "ref": ""
  },
  {
   "id": "FRD-QTR",
   "term": "Quarterly Review",
   "tag": "Certification",
   "def": "A regular synchronous meeting hosted by a FedRAMP Certified cloud service provider for agency customers, following FedRAMP Collaborative Continuous Monitoring rules.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-RGL",
   "term": "Regularly",
   "tag": "General",
   "def": "Performing the activity on a consistent, predictable, and repeated basis, at set intervals, automatically if possible, following a documented plan. These intervals may vary as appropriate between different activities.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-RMV",
   "term": "Remediated Vulnerability",
   "tag": "Vulnerability",
   "def": "A vulnerability that has been neutralized or eliminated and is no longer detected.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-RSP",
   "term": "Responsibly",
   "tag": "General",
   "def": "In a way that shows that you have good judgment and the ability to act correctly and make decisions on your own.",
   "note": "Refrain from broadcasting any details that might assist adversaries in their endeavors, disclosing vulnerabilities prior to full remediation, or providing overly specific technical information that could potentially facilitate further compromise.",
   "ref": ""
  },
  {
   "id": "FRD-RTR",
   "term": "Routine Recurring Change",
   "tag": "Significant Changes",
   "def": "The type of significant change that regularly and routinely recurs as part of ongoing operations, vulnerability mitigation, or vulnerability remediation.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-SCT",
   "term": "Security Category",
   "tag": "General",
   "def": "Has the meaning from NIST FIPS 199, which is \"The characterization of information or an information system based on an assessment of the potential impact that a loss of confidentiality, integrity, or availability of such information or information system would have on organizational operations, organizational assets, or individuals.\" Security categories are often referred to as \"impact levels\" and include Low, Moderate, and High.",
   "note": "",
   "ref": "NIST FIPS 199 Standards for Security Categorization of Federal Information and Information Systems"
  },
  {
   "id": "FRD-SDR",
   "term": "Security Decision Record (SDR)",
   "tag": "General",
   "def": "A persistently maintained, verified, and validated record of the security decisions made by a provider over the lifecycle of a cloud service offering. The Security Decision Record replaces the traditional System Security Plan and documents how applicable FedRAMP Practices are addressed, including implementation rationale, resulting customer risk, assessment findings, and supporting artifacts.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-SGC",
   "term": "Significant Change",
   "tag": "Significant Changes",
   "def": "Has the meaning given in NIST SP 800-37 Rev. 2 which is \"a change that is likely to substantively affect the security or privacy posture of a system.\"",
   "note": "",
   "ref": "NIST SP 800-37 Rev. 2"
  },
  {
   "id": "FRD-TPR",
   "term": "Third-Party Information Resource",
   "tag": "Information Resource",
   "def": "Any information resource that is not entirely included in the Minimum Assessment Scope for the cloud service offering obtaining FedRAMP Certification.",
   "note": "",
   "ref": ""
  },
  {
   "id": "FRD-TLA",
   "term": "Top-Level Administrative Account",
   "tag": "Accounts",
   "def": "The most privileged account with the highest level of access within a cloud service offering for a customer organization, typically with complete control over all aspects of the cloud service offering, including managing resources, users, access, privileges, and the account itself.",
   "note": "Any references to top-level administrative accounts in FedRAMP materials should be presumed to apply to top-level administrative roles or other similar capabilities that are used to assign top-level administrative account privileges.",
   "ref": ""
  },
  {
   "id": "FRD-TRF",
   "term": "Transformative Change",
   "tag": "Significant Changes",
   "def": "The type of significant change that introduces substantive potential security risks that are likely to affect existing risk determinations and must be assessed in depth.",
   "note": "Transformative changes typically introduce major features or capabilities that may change how a customer uses the service (in whole or in part) and require extensive updates to security assessments, operational procedures, deployment plans, and documentation.",
   "ref": ""
  },
  {
   "id": "FRD-TRC",
   "term": "Trust Center",
   "tag": "General",
   "def": "A secure repository or service used by cloud service providers to store and share FedRAMP Certification Data. Trust centers are the complete and definitive source for FedRAMP Certification Data and must follow the FedRAMP Certification Data Sharing rules to be FedRAMP-compatible.",
   "note": "In FedRAMP documentation, all references to trust centers indicate FedRAMP-compatible trust centers unless otherwise specified.",
   "ref": ""
  },
  {
   "id": "FRD-VLN",
   "term": "Validation",
   "tag": "General",
   "def": "Confirmation through objective evidence that implemented security capabilities and related certification data are suitable for their intended FedRAMP Certification use and support the expected security outcomes for a cloud service offering.",
   "note": "This adapts the ISO conformity assessment concept of validation to the FedRAMP Certification context.",
   "ref": "ISO/IEC 27001:2022"
  },
  {
   "id": "FRD-VRF",
   "term": "Verification",
   "tag": "General",
   "def": "Confirmation through objective evidence that specified FedRAMP Practices have been fulfilled for a cloud service offering.",
   "note": "This adapts the ISO conformity assessment concept of verification to the FedRAMP Certification context.",
   "ref": "ISO/IEC 27001:2022"
  },
  {
   "id": "FRD-VUL",
   "term": "Vulnerability",
   "tag": "Vulnerability",
   "def": "Has the meaning given to \"security vulnerability\" in 6 USC § 650 (25), which is \"any attribute of hardware, software, process, or procedure that could enable or facilitate the defeat of [...] management, operational, and technical controls used to protect against an unauthorized effort to adversely affect the confidentiality, integrity, and availability of an information system or its information.\" This includes gaps in Rev5 Controls and 20x Key Security Indicators, software vulnerabilities, misconfigurations, exposures, weak credentials, insecure services, and all other such potential weaknesses in protection (intentional or unintentional).",
   "note": "",
   "ref": "6 USC § 650 (25)"
  },
  {
   "id": "FRD-VLD",
   "term": "Vulnerability Detection",
   "tag": "Vulnerability",
   "def": "The systematic process of discovering and identifying security vulnerabilities in information resources through assessment, scanning, threat intelligence, vulnerability disclosure mechanisms, bug bounties, supply chain monitoring, and other capabilities. This process includes the initial discovery of a vulnerability's existence and the determination of affected information resources within a cloud service offering.",
   "note": "This definition applies to other forms such as \"detect vulnerabilities\" or simply \"detection\" / \"detected\" used in FedRAMP materials.",
   "ref": ""
  },
  {
   "id": "FRD-VLR",
   "term": "Vulnerability Response",
   "tag": "Vulnerability",

   "note": "This definition applies to other forms such as \"respond to vulnerabilities\" or simply \"response\" / \"responded\" used in FedRAMP materials.",
   "ref": ""
  }

   "short": "AFC",
   "web": "addressing-fedramp-communication",
   "tag": "assurance",
   "status": "stable",
   "purpose": "The Addressing FedRAMP Communication rules (formerly FedRAMP Security Inbox) ensure FedRAMP can reliably contact the security and compliance staff responsible for every FedRAMP-authorized cloud service offering. These rules also set expectations for urgent communications, response time testing, and routing important messages separately from general support or customer service channels.",

    "FRP": {
     "name": "FedRAMP Responsibilities",
     "description": "These rules apply to FedRAMP when communicating with cloud service providers.",
     "applicability": {
      "types": [
       "20x",
       "Rev5"
      ],
      "paths": [
       "Program",

 "vdr_cso": [
  {
   "id": "VDR-CSO-DET",
   "name": "Vulnerability Detection",
   "force": "MUST",
   "statement": "Providers MUST systematically, persistently, and promptly discover and identify vulnerabilities within their cloud service offering using appropriate techniques such as assessment, scanning, threat intelligence, vulnerability disclosure mechanisms, bug bounties, penetration testing, incident response, automated control testing, supply chain monitoring, and other relevant capabilities; this process is called vulnerability detection. Vulnerability detection includes persistently verifying and validating that information resources and processes are operating as intended and documented for FedRAMP Practices.",
   "danger": "Vulnerability Detection and Response includes all efforts to identify weaknesses in a system and is NOT limited to traditional vulnerability scanning or testing. An out-of-date control statement in the Security Decision Record is a vulnerability that must be detected and remediated just like any other vulnerability."
  },
  {
   "id": "VDR-CSO-RES",
   "name": "Vulnerability Response",
   "force": "MUST",
   "statement": "Providers MUST systematically, persistently, and promptly track, evaluate, monitor, mitigate, remediate, assess exploitation of, report, and otherwise manage all detected vulnerabilities within their cloud service offering; this process is called vulnerability response.",
   "danger": ""
  },
  {
   "id": "VDR-CSO-FAV",
   "name": "Failures Are Vulnerabilities",
   "force": "MUST",
   "statement": "Providers MUST treat problems or failures with their vulnerability detection and response processes as vulnerabilities.",
   "danger": ""
  },
  {
   "id": "VDR-CSO-DFR",
   "name": "Design For Resilience",
   "force": "SHOULD",
   "statement": "Providers SHOULD make design and architecture decisions for their cloud service offering that mitigate the risk of vulnerabilities by default AND decrease the risk and complexity of vulnerability detection and response.",
   "danger": ""
  },
  {
   "id": "VDR-CSO-ADT",
   "name": "Automate Detection",
   "force": "SHOULD",
   "statement": "Providers SHOULD use automated services to improve and streamline vulnerability detection and response.",
   "danger": ""
  },
  {
   "id": "VDR-CSO-DAC",
   "name": "Detect After Changes",
   "force": "SHOULD",
   "statement": "Providers SHOULD automatically perform vulnerability detection on representative samples of new or significantly changed information resources.",
   "danger": ""
  },
  {
   "id": "VDR-CSO-MSP",
   "name": "Maintain Security",
   "force": "SHOULD NOT",
   "statement": "Providers SHOULD NOT weaken the security of information resources to facilitate vulnerability scanning, detection, or assessment activities.",
   "danger": ""
  },
  {
   "id": "VDR-CSO-AKE",
   "name": "Avoid KEVs",
   "force": "SHOULD NOT",
   "statement": "Providers SHOULD NOT deploy or otherwise activate new machine-based information resources with Known Exploited Vulnerabilities.",
   "danger": ""
  },
  {
   "id": "VDR-CSO-SIR",
   "name": "Sampling",
   "force": "MAY",
   "statement": "Providers MAY sample effectively identical information resources, especially machine-based information resources, when performing vulnerability detection UNLESS doing so would decrease the efficiency or effectiveness of vulnerability detection.",
   "danger": ""
  }
 ],

 "ver": {
  "pain_levels": [
   "**N1**: Exploitation could be expected to have minimal customer effects on one or more agencies that use the cloud service offering.",
   "**N2**: Exploitation could be expected to have narrow customer effects on one or more agencies that use the cloud service offering.",
   "**N3**: Exploitation could be expected to have a disruptive customer effect on one agency that uses the cloud service offering.",
   "**N4**: Exploitation could be expected to have a debilitating customer effect on one agency that uses the cloud service offering OR a disruptive customer effect on more than one federal agency that uses the cloud service offering.",
   "**N5**: Exploitation could be expected to have a debilitating customer effect on more than one agency that uses the cloud service offering."
  ],
  "factors": [
   "**Criticality**: How important are the systems or information that might be impacted by the vulnerability?",
   "**Reachability**: How might a threat actor reach the vulnerability and how likely is that?",
   "**Exploitability**: How easy is it for a threat actor to exploit the vulnerability and how likely is that?",
   "**Detectability**: How easy is it for a threat actor to become aware of the vulnerability and how likely is that?",
   "**Prevalence**: How much of the cloud service offering is affected by the vulnerability?",
   "**Privilege**: How much privileged authority or access is granted or can be gained from exploiting the vulnerability?",
   "**Proximate Vulnerabilities**: How does this vulnerability interact with previously detected vulnerabilities, especially partially or fully mitigated vulnerabilities?",
   "**Known Threats**: How might already known threats leverage the vulnerability and how likely is that?"
  ],
  "eva_rules": [
   {
    "id": "VER-EVA-ELX",
    "name": "Evaluate Exploitability",
    "force": "MUST",
    "statement": "Providers MUST evaluate detected vulnerabilities, considering the context of the cloud service offering, to determine if they are likely exploitable vulnerabilities."
   },
   {
    "id": "VER-EVA-EIR",
    "name": "Evaluate Internet-Reachability",
    "force": "MUST",
    "statement": "Providers MUST evaluate detected vulnerabilities, considering the context of the cloud service offering, to determine if they are internet-reachable vulnerabilities."
   },
   {
    "id": "VER-EVA-EPA",
    "name": "Estimate Potential Agency Impact",
    "force": "MUST",
    "statement": "Providers MUST evaluate detected vulnerabilities, considering the context of the cloud service offering, to estimate the potential agency impact of exploitation on government customers AND assign one of the following Potential Agency Impact N-ratings (PAIN):"
   },
   {
    "id": "VER-EVA-AIA",
    "name": "Assume It's Automatable",
    "force": "MUST",
    "statement": "Providers MUST assume the exploitation of vulnerabilities can be automated UNLESS they have evidence proving otherwise."
   },
   {
    "id": "VER-EVA-GRV",
    "name": "Group Vulnerabilities",
    "force": "SHOULD",
    "statement": "Providers SHOULD evaluate detected vulnerabilities, considering the context of the cloud service offering, to identify logical groupings of affected information resources that may improve the efficiency and effectiveness of vulnerability response by consolidating further activity; FedRAMP Vulnerability Detection and Response rules are then applied to these consolidated groupings of vulnerabilities instead of each individual detected instance."

    "id": "VER-RPT-PER",
    "name": "Persistent Reporting",
    "force": "MUST",
    "statement": "Providers MUST report vulnerability detection and response activity (including persistent verification and validation) to all necessary parties persistently, summarizing ALL activity since the previous report; these reports are FedRAMP Certification Data and are subject to FedRAMP Certification Data Sharing rules.",
    "fields": []
   },
   {
    "id": "VER-RPT-VDT",
    "name": "Vulnerability Details",
    "force": "MUST",
    "statement": "Providers MUST include the following information (if applicable) on detected vulnerabilities when reporting on vulnerability detection and response activity, UNLESS it is an accepted vulnerability:",
    "fields": [
     "Provider's internally assigned tracking identifier",
     "Time and source of the detection",
     "Time of completed evaluation",
     "Is it an internet-reachable vulnerability or not?",
     "Is it a likely exploitable vulnerability or not?",
     "Historically and currently estimated Potential Agency Impact N-rating of exploitation",
     "Time and Potential Agency Impact N-rating of each completed and evaluated reduction in Potential Agency Impact N-rating",
     "Estimated time and target Potential Agency Impact N-rating of next reduction in Potential Agency Impact N-rating",
     "Is it currently or is it likely to become an overdue vulnerability or not? If so, explain.",
     "Any supplementary information the provider responsibly determines will help federal agencies assess or mitigate the risk to their federal customer data within the cloud service offering resulting from the vulnerability",
     "Final disposition of the vulnerability"
    ]
   },
   {
    "id": "VER-RPT-AVI",
    "name": "Accepted Vulnerability Info",
    "force": "MUST",
    "statement": "Providers MUST include the following information on accepted vulnerabilities when reporting on vulnerability detection and response activity:",

     "Is it a likely exploitable vulnerability or not?",
     "Currently estimated Potential Agency Impact N-rating",
     "Explanation of why this is an accepted vulnerability",

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`(.+?)`/g,"<code>$1</code>");}
function forceClass(f){return (f||"").toLowerCase().replace(/\s+/g,"");}
function forceBadge(f){if(!f)return"";return `<span class="force ${forceClass(f)}">${esc(f)}</span>`;}
function rid(id){return `<span class="rid">${esc(id)}</span>`;}

/* deadline -> hours + severity bucket */
function toHours(c){if(!c)return null;const n=c.num;switch(c.type){case"hours":return n;case"days":return n*24;case"bizdays":return n*24;case"months":return n*730;default:return n;}}
function sev(hrs){if(hrs==null)return"none";if(hrs<=24)return"crit";if(hrs<=8*24)return"sev";if(hrs<=32*24)return"high";if(hrs<=96*24)return"mod";if(hrs<=192*24)return"elev";return"low";}
function fmtCell(c){
  if(!c)return"—";
  if(c.type==="hours"){ if(c.num<1)return Math.round(c.num*60)+" min"; return c.num+" hr"+(c.num===1?"":"s"); }
  if(c.type==="days")return c.num+" day"+(c.num===1?"":"s");
  if(c.type==="bizdays")return c.num+" biz day"+(c.num===1?"":"s");
  if(c.type==="months")return c.num+" mo";
  return c.num+" "+c.type;
}

function legendSev(){return `<div class="legend"><span><span class="sw" style="background:var(--s-crit)"></span>≤ 24 hrs</span><span><span class="sw" style="background:var(--s-sev)"></span>≤ 8 days</span><span><span class="sw" style="background:var(--s-high)"></span>≤ 32 days</span><span><span class="sw" style="background:var(--s-mod)"></span>≤ 96 days</span><span><span class="sw" style="background:var(--s-elev)"></span>≤ 192 days</span><span class="faint">— = no deadline</span></div>`;}

/* rule card list (VDR/VER/etc.) with crux map */
function ruleList(items,cruxMap){
  return items.map(r=>{
    const cx=cruxMap&&cruxMap[r.id];
    const stmt=r.statement?`<div class="stmt" data-min-depth="3">${md(r.statement)}${r.danger?`<div class="danger"><b>Watch out:</b> ${md(r.danger)}</div>`:""}</div>`:"";
    return `<div class="rule" data-exp>
      <div class="hd"><span class="chev">▸</span>
        <div class="meta">
          <div class="r1">${rid(r.id)} ${forceBadge(r.force)} <span class="nm">${esc(r.name)}</span></div>
          ${cx?`<div class="cx" data-min-depth="2">${md(cx)}</div>`:""}
        </div>
      </div>${stmt}</div>`;
  }).join("");
}

const CX_VDR={
 "VDR-CSO-DET":"Find weaknesses everywhere, all the time — not just CVE scans. Assessment, threat intel, bug bounties, pen tests, supply-chain monitoring all count. An out-of-date statement in your Security Decision Record is itself a vulnerability to detect.",
 "VDR-CSO-RES":"Once found, a vulnerability must be tracked, evaluated, monitored, mitigated/remediated, and reported — a managed lifecycle, not a one-off ticket. Mitigation reduces risk; remediation eliminates it. They are not interchangeable.",
 "VDR-CSO-FAV":"If your detection or response process itself breaks, that failure is a vulnerability too. A blind scanner or a broken pipeline is a hole an attacker can use.",
 "VDR-CSO-DFR":"Build the service so vulnerabilities are less likely by default and easier to detect and fix. Good architecture lowers the whole program's cost.",
 "VDR-CSO-ADT":"Use automation to run detection and response. Not mandatory, but the cadences and clocks elsewhere are effectively impossible to hit by hand.",
 "VDR-CSO-DAC":"When you deploy something new or significantly changed, automatically scan a representative sample of it — catch the regression at the door.",
 "VDR-CSO-MSP":"Don't lower a resource's security just to make scanning easier. The test must not become the hole.",
 "VDR-CSO-AKE":"Don't stand up new machine resources that already carry a Known Exploited Vulnerability. Start clean.",
 "VDR-CSO-SIR":"You MAY scan a representative sample of identical resources instead of every instance — unless sampling would actually weaken detection.",
};
const CX_VER={
 "VER-EVA-ELX":"Judge whether a finding is actually exploitable in your real context. Most scanner findings are not — but call it 'not exploitable' carelessly and a breach traced back to it will hurt your certification.",
 "VER-EVA-EIR":"Judge whether a payload from the public internet could reach and trigger it — even indirectly. Log4Shell and SQL injection reach 'private' systems through the app tier. Filter the payload and it stops being internet-reachable.",
 "VER-EVA-EPA":"Assign a Potential Agency Impact rating N1–N5 — how badly exploitation would hurt the agencies using you. This rating drives every remediation clock.",
 "VER-EVA-AIA":"Assume exploitation can be automated unless you can prove otherwise. Default to the worse case.",
 "VER-EVA-GRV":"Group related findings into one logical unit so response applies once to the group, not a thousand identical tickets.",
 "VER-EVA-EFP":"Screen out false positives — findings not actually present in an exploitable state. A remediated or fully-mitigated vuln can't be reclassified as a false positive.",
};
const CX_RPT={
 "VER-RPT-PER":"Report all detection/response activity to agencies continuously, each report covering everything since the last. These reports are Certification Data.",
 "VER-RPT-VDT":"For each active vulnerability, report a defined set of details — tracking ID, reachability, exploitability, current and historical PAIN, next planned reduction, overdue status, disposition.",
 "VER-RPT-AVI":"Accepted vulnerabilities get a lighter, specified field set — including why it was accepted.",
 "VER-RPT-NID":"Never leak details that would help an attacker, but always share enough for agencies to make an informed risk decision. Balance, not silence.",
 "VER-RPT-HLO":"Include a high-level overview of everything you did — disclosure programs, bug bounties, pen tests, assessments — not just the findings.",
 "VER-RPT-RPD":"You MAY disclose publicly only when you judge it won't lead to exploitation.",
};
const CX_FRC={
 "FRC-CSO-FCP":"Pick a target Certification Profile (Type × Path × Class) and apply every relevant FedRAMP Practice to the offering.",
 "FRC-CSO-PKG":"Submit a complete Certification Package for initial certification — the replacement for the old authorization package.",
 "FRC-CSO-JSN":"Any machine-readable info a rule asks for must be valid JSON against that rule's schema. Machine-readability is a hard requirement, not a nicety.",
 "FRC-CSO-POP":"One offering can't hold both a Rev5 and a 20x Program certification. Pick one type.",
 "FRC-CSO-MRA":"You stay accountable for the accuracy of the whole package even when an assessor or advisor helped build it.",
 "FRC-CLA-ASF":"Class A leans on a recent (≤12 mo) pass from an approved framework — Rev5, SOC 2 Type II, or GovRAMP.",
 "FRC-CLA-MFR":"Class A still has a mandatory FedRAMP rule set on top of the external framework.",
 "FRC-APP-FCP":"Your initial package must reflect status you verified and validated within the previous 7 days. It has to be fresh.",
 "FRC-APP-NTP":"You apply yourself — no third party (including an assessor) applies on your behalf.",
 "FRC-CCL-UCC":"Moving up a class means a new certification with all higher requirements met first.",
 "FRC-CCL-DCC":"Moving down a class also requires a new certification.",
 "FRC-CCL-DNP":"Give all necessary parties ≥120 days' notice before downgrading or cancelling.",
};
const CX_SCN={
 "SCN-CSO-EVA":"Every potential significant change gets sorted into a type first — that decides which notification track it follows.",
 "SCN-ADP-NTF":"Adaptive change: notify all necessary parties within 10 business days after finishing.",
 "SCN-RTR-NNR":"Routine recurring change: no formal notification at all — it's exempt.",
 "SCN-TRF-NIP":"Transformative change: warn of initial plans ≥30 business days before you start.",
 "SCN-TRF-NFP":"Transformative change: send final plans ≥10 business days before you start.",
 "SCN-TRF-NAF":"Transformative change: notify within 5 business days after finishing.",
 "SCN-TRF-NAV":"Transformative change: notify within 5 business days after verification/validation, with the assessment results.",
 "SCN-TRF-UPD":"Publish updated docs within 30 business days of finishing a transformative change.",
 "SCN-CSO-EMG":"In an emergency you may make even transformative changes first and follow the notification rules after.",
 "SCN-CSO-HRM":"All change notifications and their audit records exist in both human-readable and JSON form.",
 "SCN-CSO-HIS":"Keep 12 months of change notifications with your Certification Data.",
};
const CX_IEC={
 "IEC-CSO-EFR":"Promptly test every incident against one question: does it affect the confidentiality or integrity of federal customer data? If yes (or likely), it's FedRAMP-reportable.",
 "IEC-CSO-DPR":"Until you've rated it, treat a reportable incident as PAIN N5 — the worst — which triggers the fastest clocks. You can't buy time by stalling the rating.",
 "IEC-CSO-EFI":"Promptly estimate the incident's PAIN rating (this step is called Incident Rating) to set the real reporting cadence.",
 "IEC-CSO-AIR":"Use automation to minimize human hands in incident reporting. With initial reports due in minutes at Class D, hand-built email can't keep up.",
};
const CX_CDS={
 "CDS-CSO-PUB":"Publish core offering info publicly in both human-readable and JSON form.",
 "CDS-CSO-UTC":"Store and share Certification Data through a FedRAMP-compatible trust center.",
 "CDS-CSO-CBF":"When data exists in both human and machine form, automation keeps the two consistent.",
 "CDS-CSO-RIS":"Share enough for an agency to decide, but never sensitive detail that would help an attacker.",
 "CDS-TRC-USH":"A trust center shares Certification Data with all necessary parties without interruption.",
 "CDS-TRC-PAC":"A trust center offers documented programmatic access to everything — including the human-readable materials.",
 "CDS-TRC-ACL":"A trust center logs access and keeps access summaries for at least six months.",
};
const CX_CCM={
 "CCM-OCR-AVL":"Deliver an Ongoing Certification Report to all necessary parties every 3 months, summarizing the whole period.",
 "CCM-OCR-NRD":"Publish the target date of your next report with your public Certification Data.",
 "CCM-OCR-FBM":"Give agencies an asynchronous way to ask questions about each report.",
 "CCM-QTR-REG":"Provide a registration link or calendar file for Quarterly Reviews.",
 "CCM-QTR-SAR":"Schedule the Quarterly Review shortly after releasing the Ongoing Certification Report.",
};
